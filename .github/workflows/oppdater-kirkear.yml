name: Oppdater kirkeårsdata

on:
  schedule:
    # Den 3. hver måned kl. 04:23 UTC. Kjører også i måneder uten nye data,
    # slik at GitHub ikke slår av jobben etter 60 dager uten aktivitet.
    - cron: "23 4 3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kirkear
  cancel-in-progress: false

jobs:
  oppdater:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Test tolkingen
        run: python -m pytest -q tests

      - name: Hent og tolk Kirkens kalender
        id: hent
        run: python scripts/hent_kirkear.py

      - name: Lagre endringer
        # Lagrer også når ett av årene feilet, så lenge filen ble skrevet (gode år beholdes).
        if: always() && steps.hent.outcome != 'skipped'
        run: |
          git config user.name  "kirkear-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kirkear.json
          if git diff --cached --quiet; then
            echo "Ingen endringer."
          else
            git commit -m "Oppdater kirkeårsdata $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Last opp tekstutdrag for feilsøking
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: feilsok
          path: feilsok/
          retention-days: 30
