name: Oppdater kirkeårsdata

on:
  schedule:
    # Den 3. hver måned kl. 04:23 UTC. Kjører også i måneder uten nye data,
    # slik at GitHub ikke slår av jobben etter 60 dager uten aktivitet.
    - cron: "23 4 3 * *"
  workflow_dispatch: {}
  # Kjør også når skriptet eller jobben endres.
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: kirkear
  cancel-in-progress: false

jobs:
  oppdater:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Test tolkingen
        run: python -m pytest -q tests

      - name: Hent og tolk Kirkens kalender
        id: hent
        run: python scripts/hent_kirkear.py 2>&1 | tee hent.log; exit ${PIPESTATUS[0]}

      - name: Lagre endringer
        # Lagrer også når ett av årene feilet, så lenge filen ble skrevet (gode år beholdes).
        if: always() && steps.hent.outcome != 'skipped'
        run: |
          if [ ! -f data/kirkear.json ]; then echo "Ingen datafil å lagre."; exit 0; fi
          git config user.name  "kirkear-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kirkear.json
          if git diff --cached --quiet; then
            echo "Ingen endringer."
          else
            git commit -m "Oppdater kirkeårsdata $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Lagre feilsøkingsdata i grenen «feilsok»
        # Teksten fra Kirkens offentlige PDF-er + logg, så feilen kan rettes uten innlogging.
        if: failure() && steps.hent.outcome == 'failure'
        run: |
          mkdir -p /tmp/fs && cp -r feilsok/. /tmp/fs/ 2>/dev/null || true
          cp hent.log /tmp/fs/ 2>/dev/null || true
          git config user.name  "kirkear-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan feilsok
          git rm -rq --cached . && git clean -fdq -e feilsok
          rm -rf feilsok && cp -r /tmp/fs feilsok
          git add -f feilsok
          git commit -qm "Feilsøkingsdata $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin feilsok
